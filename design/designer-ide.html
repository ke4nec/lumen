<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Lumen Designer 四套工作区设计。单文件内置总览、A/B/C/D 四套可交互方案及明暗主题；参考 Qt Designer、Visual Studio 与现有 Lumen 控件能力。">
    <title>Lumen Designer — 四套工作区设计总览</title>
    <style>
/* Designer workspace proposals. Theme mapping: docs/lumen-visual-system-design.md §3.6.
   Workspace geometry and interaction contract: docs/lumen-designer-workspace-design.md. */
:root,[data-theme="light"] {
    color-scheme: light;
    --page:#f4f4f5; --surface:#fff; --elevated:#fff; --sunken:#f4f4f5;
    --text:#18181b; --secondary:#52525b; --border:#d4d4d8; --strong:#71717a;
    --accent:#3460be; --on-accent:#fff; --accent-text:#234a91; --selected:#e0eaff;
    --focus:#234a91; --success:#256746; --warning:#8a5700; --error:#aa343a;
    --grid:rgba(212,212,216,.706); --guide:#cf2e5f; --scrim:rgba(0,0,0,.52);
    --control:32px; --radius:4px; --gap:8px; --left:232px; --right:288px;
    --caption:12px; --body:14px; --title:20px;
    font-family:Inter,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:14px; line-height:1.43;
}
[data-theme="dark"] {
    color-scheme:dark;
    --page:#18181b; --surface:#27272e; --elevated:#34343f; --sunken:#2e2e36;
    --text:#f1f1f4; --secondary:#a1a1aa; --border:#3b3b45; --strong:#8c8c98;
    --accent:#568cf0; --on-accent:#000; --accent-text:#a8c5fa; --selected:#2e3c60;
    --focus:#96b9fa; --success:#73c991; --warning:#e2b566; --error:#e05a60;
    --grid:rgba(82,82,91,.706); --guide:#f4587f;
}
* {box-sizing:border-box}
body {margin:0; background:var(--page); color:var(--text)}
button,input,select {font:inherit; color:inherit}
button,a,input,select {touch-action:manipulation}
button {cursor:pointer}
a {color:var(--accent-text); text-decoration:none}
a:hover {text-decoration:underline}
button {border:0; background:none}
button:disabled {color:var(--strong); cursor:default; opacity:.65}
button:focus-visible,a:focus-visible,summary:focus-visible {outline:2px solid var(--focus); outline-offset:-2px}
input:focus-visible,select:focus-visible {outline:2px solid var(--focus); outline-offset:-1px}
[hidden] {display:none!important}
svg.icon {width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.muted {color:var(--secondary)}
.mono,code,kbd {font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace; font-size:12px}
.spacer {flex:1}
.badge {font-size:11px; padding:2px 6px; border:1px solid var(--border); border-radius:var(--radius); color:var(--secondary); white-space:nowrap}
.badge.accent {background:var(--selected); color:var(--accent-text); border-color:transparent}
.badge.success {color:var(--success)}
.btn {display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:var(--control); padding:4px 10px; border-radius:var(--radius); color:var(--secondary); white-space:nowrap; font-size:var(--caption)}
.btn:hover:not(:disabled) {background:var(--sunken); color:var(--text)}
.btn.active,.btn[aria-pressed="true"] {color:var(--accent-text); background:var(--selected)}
.btn.primary {background:var(--accent); color:var(--on-accent)}
.btn.primary:hover {background:var(--accent); filter:brightness(1.08); color:var(--on-accent)}
.btn.outline-panel {border:1px solid var(--border); background:var(--surface)}
.btn.icon-only {width:var(--control); padding:4px}
.divider {width:1px; height:20px; background:var(--border); margin:0 6px; flex:none}
.field {height:var(--control); padding:4px 8px; border:1px solid var(--border); border-radius:var(--radius); background:var(--sunken); min-width:0; width:100%; font-size:12px}
.field[aria-invalid="true"] {border-color:var(--error)}
.search {display:flex; align-items:center; gap:8px; margin:8px 12px; border:1px solid var(--border); border-radius:var(--radius); background:var(--page); padding:0 8px; color:var(--secondary)}
.search input {width:100%; height:var(--control); min-width:0; border:0; outline:0; background:none; font-size:12px}
.search:focus-within {outline:2px solid var(--focus); outline-offset:-1px}
.scroll {overflow:auto; min-height:0; scrollbar-width:thin; scrollbar-color:var(--border) transparent}
.review-strip {height:44px; display:flex; align-items:center; padding:0 16px; gap:16px; border-bottom:1px solid var(--border); background:var(--surface); flex:none}
.review-strip .back {font-size:12px; display:flex; align-items:center; gap:8px; color:var(--secondary)}
.version-nav {display:flex; gap:4px}
.version-nav a {display:flex; gap:8px; align-items:center; padding:6px 12px; border-radius:var(--radius); color:var(--secondary); font-size:12px}
.version-nav a.current {color:var(--accent-text); background:var(--selected)}
.version-nav b {font-family:monospace}
.prototype-label {font-size:11px; color:var(--secondary); margin-left:auto}
.workbench-page {height:100dvh; display:flex; flex-direction:column; min-width:960px; overflow:hidden}
.ide {display:flex; flex-direction:column; flex:1; min-height:0; background:var(--surface)}
.ide-title {height:44px; display:flex; align-items:center; gap:6px; padding:0 12px; border-bottom:1px solid var(--border); flex:none}
.brand {font-size:14px; font-weight:650; display:flex; align-items:center; gap:10px; letter-spacing:-.3px; margin-right:16px}
.brand-mark {display:inline-grid; place-content:center; width:24px; height:24px; border-radius:6px; color:var(--on-accent); background:var(--accent); font-weight:700; font-size:16px}
.ide-title .project-name {position:absolute; left:50%; transform:translateX(-50%); font-size:12px; color:var(--secondary); pointer-events:none}
.project-name b {font-weight:500; color:var(--text)}
.main-tools {height:48px; padding:0 12px; display:flex; align-items:center; gap:4px; border-bottom:1px solid var(--border); flex:none}
.main-tools .hint {font-size:12px; color:var(--secondary); margin:0 10px}
.workspace {display:grid; grid-template-columns:var(--left) 6px minmax(260px,1fr) 6px var(--right); flex:1; min-height:0; overflow:hidden}
.leftdock,.rightdock {display:flex; flex-direction:column; background:var(--surface); min-height:0; min-width:0; overflow:hidden}
.panel-head {height:40px; display:flex; align-items:center; gap:8px; padding:0 12px; flex:none; border-bottom:1px solid var(--border)}
.panel-head h2 {font-size:12px; font-weight:600; margin:0; letter-spacing:.02em}
.panel-head .count {color:var(--secondary); font-size:11px}
.panel-head .btn {margin-left:auto}
.splitter {position:relative; background:var(--page); cursor:col-resize; z-index:3; outline:0}
.splitter::after {content:""; position:absolute; top:0; bottom:0; left:2px; width:1px; background:var(--border)}
.splitter::before {content:""; position:absolute; inset:0 -3px}
.splitter:hover::after,.splitter:focus-visible::after {background:var(--accent); width:3px; left:1px}
.dock-tabs,.small-tabs {display:flex; flex:none; border-bottom:1px solid var(--border); min-height:40px}
.dock-tabs button,.small-tabs button {position:relative; flex:1; color:var(--secondary); padding:8px 6px; font-size:12px; white-space:nowrap}
.dock-tabs button[aria-selected="true"],.small-tabs button[aria-selected="true"] {color:var(--accent-text)}
.dock-tabs button[aria-selected="true"]::after,.small-tabs button[aria-selected="true"]::after {content:""; position:absolute; height:2px; background:var(--accent); bottom:-1px; left:12px; right:12px}
.toolbox {min-height:0; display:flex; flex-direction:column; flex:1}
.toolbox-list {padding:0 8px 12px; flex:1}
.tool-group summary {padding:8px 4px; color:var(--secondary); font-size:11px; cursor:pointer; user-select:none}
.tool-group summary span {float:right; padding-right:4px; color:var(--strong)}
.tool-item {height:32px; width:100%; display:flex; align-items:center; gap:10px; padding:0 8px; color:var(--text); border-radius:var(--radius); text-align:left; font-size:12px}
.tool-item:hover {background:var(--selected); color:var(--accent-text)}
.tool-item .tool-hint {margin-left:auto; opacity:0; color:var(--secondary)}
.tool-item:hover .tool-hint,.tool-item:focus-visible .tool-hint {opacity:1}
.panel-foot {border-top:1px solid var(--border); padding:8px 12px; font-size:11px; color:var(--secondary); flex:none; line-height:1.6}
.outline-panel {display:flex; flex-direction:column; min-height:0; flex:1}
.tree {padding:8px 4px; flex:1}
.tree-row {height:32px; width:100%; padding:0 8px 0 calc(6px + var(--depth)*20px); display:flex; align-items:center; gap:6px; color:var(--text); font-size:12px; text-align:left; position:relative; border-radius:var(--radius); white-space:nowrap}
.tree-row:hover {background:var(--sunken)}
.tree-row[aria-selected="true"] {background:var(--selected); color:var(--accent-text)}
.tree-row[aria-selected="true"]::before {content:""; position:absolute; width:3px; top:4px; bottom:4px; left:0; background:var(--accent); border-radius:2px}
.tree-row .tree-chevron {width:18px; flex:none; display:grid; place-items:center}
.tree-row .tree-chevron svg {width:12px}
.tree-row .node-name {overflow:hidden; text-overflow:ellipsis}
.tree-row .node-type {margin-left:auto; font-size:10px; color:var(--secondary); padding-left:8px}
.outline-actions {padding:4px 8px; display:flex; gap:4px; border-top:1px solid var(--border)}
.project-block {padding:10px 12px; border-bottom:1px solid var(--border); display:flex; gap:8px; align-items:center; font-size:12px}
.project-block span {color:var(--secondary); font-size:11px; display:block; margin-top:2px}
.center {min-width:0; min-height:0; display:flex; flex-direction:column; background:var(--page)}
.document-tabs {height:40px; display:flex; align-items:stretch; background:var(--surface); flex:none; border-bottom:1px solid var(--border)}
.document-tab {display:flex; align-items:center; gap:8px; padding:0 16px; border-right:1px solid var(--border); border-top:2px solid var(--accent); background:var(--page); font-size:12px; min-width:176px}
.document-tab svg {color:var(--accent-text)}
.document-tab .dirty {width:6px; height:6px; border-radius:50%; background:var(--accent); margin-left:10px; visibility:hidden}
.document-tab .dirty.on {visibility:visible}
.view-tabs {display:flex; margin-left:auto; padding:4px; gap:2px}
.canvas-controls {height:44px; display:flex; align-items:center; gap:4px; padding:0 12px; border-bottom:1px solid var(--border); background:var(--surface); flex:none}
.canvas-controls .size-label {font-size:11px; color:var(--secondary); white-space:nowrap; display:flex; align-items:center; gap:8px}
.canvas-controls select {width:auto; background:transparent; border-color:transparent; max-width:90px}
.canvas-controls .btn {padding:4px 6px}
.editor-surface {min-height:0; flex:1; display:flex; position:relative; overflow:hidden}
.canvas-column {min-width:0; min-height:0; flex:1; display:flex; flex-direction:column}
.ruler {height:18px; position:relative; flex:none; padding:2px 16px; color:var(--secondary); border-bottom:1px solid var(--border); background:var(--sunken); font:9px/16px monospace; word-spacing:34px; white-space:nowrap; overflow:hidden}
.canvas-scroll {overflow:auto; flex:1; min-height:0; position:relative; background-color:var(--page); background-image:radial-gradient(var(--grid) .75px,transparent .75px); background-size:8px 8px; scrollbar-width:thin; scrollbar-color:var(--border) transparent}
.canvas-scroll.no-grid {background-image:none}
.canvas-content {min-width:100%; min-height:100%; width:max-content; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; gap:12px}
.frame-caption {width:100%; display:flex; justify-content:space-between; color:var(--secondary); font-size:11px; letter-spacing:.02em; white-space:nowrap}
.artboard-wrap {position:relative; flex:none}
.artboard {transform-origin:top left; width:520px; background:var(--surface); color:var(--text); box-shadow:0 2px 6px #00000020; border:1px solid var(--border); border-radius:8px; position:relative; padding:32px; display:flex; flex-direction:column; gap:16px}
.preview-node {position:relative; min-width:0; flex-shrink:0}
.preview-node.hoverable:hover {outline:1px solid var(--accent)}
.preview-node.selected {outline:2px solid var(--accent); outline-offset:2px}
.preview-node.selected::before {content:attr(data-label); position:absolute; left:-4px; top:-26px; color:var(--on-accent); background:var(--accent); border-radius:3px 3px 0 0; font:11px/20px Consolas,monospace; padding:0 6px; white-space:nowrap; z-index:2; pointer-events:none}
.preview-node.selected::after {content:""; width:8px; height:8px; position:absolute; right:-7px; bottom:-7px; background:var(--surface); border:1px solid var(--accent); pointer-events:none}
.preview-text {font-size:14px; line-height:20px; padding:0; margin:0; white-space:pre-wrap; overflow-wrap:anywhere}
.preview-title {font-size:20px; font-weight:600; line-height:28px}
.preview-caption {color:var(--secondary); font-size:12px; line-height:18px}
.preview-container {display:flex; gap:8px; flex-direction:column}
.preview-row {flex-direction:row; align-items:center}
.preview-button {min-height:40px; min-width:64px; border-radius:6px; display:flex; align-items:center; justify-content:center; padding:6px 12px; background:var(--accent); color:var(--on-accent); font-size:14px; font-weight:500; border:1px solid transparent; cursor:default}
.preview-button[data-variant="outline"] {background:transparent; color:var(--text); border-color:var(--border)}
.preview-button[data-variant="ghost"] {background:transparent; color:var(--accent-text)}
.preview-button[data-variant="tonal"] {background:var(--selected); color:var(--accent-text)}
.preview-button[data-variant="danger"] {background:var(--error); color:var(--on-accent)}
.preview-input {height:40px; padding:8px 12px; background:var(--sunken); border:1px solid var(--border); border-radius:6px; font-size:14px; display:flex; align-items:center; width:100%}
.preview-check {display:flex; align-items:center; gap:10px; font-size:14px; min-height:40px}
.check-box {width:18px; height:18px; border-radius:4px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; border:1px solid var(--accent)}
.check-box.off {background:transparent; border-color:var(--strong)}
.canvas-help {position:sticky; left:12px; bottom:10px; margin-top:8px; font-size:10px; color:var(--secondary); width:max-content; padding:4px 8px; background:var(--page); border:1px solid var(--border); border-radius:4px}
.crumb-bar {height:32px; padding:0 12px; display:flex; align-items:center; gap:4px; background:var(--surface); border-top:1px solid var(--border); flex:none; overflow:hidden}
.crumb-bar button {font-size:11px; color:var(--secondary); white-space:nowrap; height:28px; padding:0 4px}
.crumb-bar button:last-child {color:var(--accent-text)}
.crumb-bar .icon {width:12px; color:var(--secondary)}
.inspector {flex:1; min-height:0; display:flex; flex-direction:column}
.selected-summary {padding:16px 14px 12px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px}
.selected-icon {width:36px; height:36px; border:1px solid var(--border); border-radius:6px; display:grid; place-items:center; background:var(--page); color:var(--accent-text)}
.selected-summary h3 {font-size:14px; margin:0 0 2px; font-weight:600}
.selected-summary p {margin:0; font-size:11px; color:var(--secondary)}
.property-scroll {flex:1; padding:0 14px 20px}
.prop-group {border-bottom:1px solid var(--border); padding:12px 0 16px}
.prop-group:last-child {border:0}
.prop-group summary {font-size:12px; font-weight:600; cursor:pointer; padding:0 0 12px; user-select:none}
.prop-group summary::marker {color:var(--secondary)}
.prop-row {display:grid; grid-template-columns:72px minmax(0,1fr); align-items:center; gap:8px; margin-bottom:8px; min-height:32px; font-size:12px}
.prop-row>span {color:var(--secondary)}
.prop-row .field {width:100%}
.dimension-fields {display:flex; gap:8px}
.dimension-field {display:flex; align-items:center; padding-left:8px; background:var(--sunken); border:1px solid var(--border); border-radius:var(--radius); flex:1; min-width:0; color:var(--secondary); font:11px monospace}
.dimension-field input {border:0; background:none; width:100%; min-width:0; height:30px; font-size:12px; padding-left:8px}
.prop-tip {color:var(--secondary); font-size:11px; line-height:1.7; margin:8px 0 0}
.prop-error {font-size:11px; color:var(--error); margin:6px 0; min-height:16px}
.check-label {display:flex; align-items:center; gap:8px; font-size:12px; min-height:32px}
input[type="checkbox"] {accent-color:var(--accent); width:16px; height:16px}
.swatch-row {display:flex; align-items:center; gap:8px; padding:8px; background:var(--sunken); border:1px solid var(--border); border-radius:var(--radius); font-size:11px}
.swatch {width:16px; height:16px; background:var(--accent); border-radius:3px}
.bottom-dock {flex:none; background:var(--surface); border-top:1px solid var(--border)}
.bottom-head {display:flex; align-items:center; padding:0 8px; gap:12px; height:36px}
.bottom-head .bottom-tab {height:36px; padding:0 4px; font-size:11px; border-bottom:2px solid transparent; color:var(--secondary)}
.bottom-head .bottom-tab.active {border-bottom-color:var(--accent); color:var(--text)}
.bottom-head .badge {margin-left:6px; padding:0 4px}
.bottom-body {height:108px; overflow:auto; border-top:1px solid var(--border)}
.diagnostic-row {display:flex; align-items:center; gap:10px; padding:8px 14px; width:100%; color:var(--secondary); font-size:12px; text-align:left; min-height:36px}
button.diagnostic-row:hover {background:var(--selected)}
.diagnostic-row .warning {color:var(--warning)}
.diagnostic-row .success {color:var(--success)}
.diagnostic-row .location {margin-left:auto; font:11px monospace; color:var(--secondary)}
.statusbar {height:28px; display:flex; align-items:center; gap:12px; padding:0 12px; background:var(--surface); border-top:1px solid var(--border); font-size:11px; color:var(--secondary); flex:none; overflow:hidden; white-space:nowrap}
.statusbar svg {width:12px}
.statusbar .status-message {overflow:hidden; text-overflow:ellipsis}
.statusbar .status-ok {display:flex; align-items:center; gap:6px; color:var(--success)}
.source-panel {width:42%; min-width:240px; border-left:1px solid var(--border); display:flex; flex-direction:column; min-height:0; background:var(--surface)}
.source-head {display:flex; align-items:center; padding:0 12px; gap:8px; min-height:36px; font-size:11px; border-bottom:1px solid var(--border)}
.source-lines {flex:1; padding:12px 0; font:11px/21px Consolas,monospace; overflow:auto; scrollbar-width:thin}
.source-line {display:flex; min-width:max-content; padding-right:12px}
.source-line .ln {width:36px; padding-right:10px; text-align:right; flex:none; color:var(--strong); user-select:none}
.source-line code {font:inherit; white-space:pre; color:var(--secondary)}
.source-line.highlight {background:var(--selected); border-left:2px solid var(--accent)}
.source-line.highlight code {color:var(--accent-text)}
.source-panel.full {width:100%; border:0}
.layout-strip {height:108px; display:flex; gap:20px; align-items:center; padding:12px 16px; overflow:auto}
.layout-strip .layout-info {min-width:140px}
.layout-strip b {font-size:12px; display:block; margin-bottom:6px}
.layout-strip span {font-size:11px; color:var(--secondary)}
.layout-strip .prop-row {margin:0; min-width:160px; grid-template-columns:48px 96px}
.layout-diagram {display:flex; align-items:center; gap:6px; border:1px dashed var(--accent); padding:8px; color:var(--accent-text); font-size:10px; flex:none}
.layout-diagram i {display:block; width:36px; height:28px; background:var(--selected); border:1px solid var(--accent); border-radius:3px}
.rail {display:none; background:var(--surface); border-right:1px solid var(--border); padding:8px; gap:8px; flex-direction:column; align-items:center}
.rail .btn {width:36px; height:36px; flex:none}
.variant-a .leftdock .toolbox {flex:1.05}
.variant-a .leftdock .outline-panel {flex:1; border-top:1px solid var(--border)}
.variant-b {--left:224px; --right:280px}
.variant-b .workspace {grid-template-columns:48px var(--left) 6px minmax(260px,1fr) 6px var(--right)}
.variant-b .rail {display:flex}
.variant-b .canvas-controls {height:48px}
.variant-b .artboard {box-shadow:0 4px 12px #00000040}
.variant-b .canvas-content {padding:48px}
.variant-b .ruler {display:none}
.variant-c {--left:280px; --right:280px}
.variant-c .leftdock .outline-panel {flex:1}
.variant-c .rightdock .toolbox {flex:1}
.variant-c .rightdock .inspector {flex:1.3; border-bottom:1px solid var(--border)}
.variant-c .canvas-content {padding:32px}
.variant-d {--left:208px; --right:248px}
.variant-d .canvas-controls .size-label {font-size:10px}
.variant-d .canvas-content {padding:32px}
.variant-d .prop-row {grid-template-columns:56px minmax(0,1fr)}
.variant-d .preview-environment {border-bottom:1px solid var(--border); padding:12px 14px}
.preview-environment>p {font-size:11px; color:var(--secondary); line-height:1.6; margin:4px 0 12px}
.preview-environment h3 {font-size:12px; margin:0 0 8px}
.variant-d .inspector .selected-summary {padding:12px 14px}
.left-collapsed .workspace {grid-template-columns:0 0 minmax(260px,1fr) 6px var(--right)}
.variant-b.left-collapsed .workspace {grid-template-columns:48px 0 0 minmax(260px,1fr) 6px var(--right)}
.left-collapsed .leftdock,.left-collapsed .splitter[data-side="left"] {visibility:hidden}
.zen .workspace {grid-template-columns:0 0 minmax(260px,1fr) 0 0}
.variant-b.zen .workspace {grid-template-columns:48px 0 0 minmax(260px,1fr) 0 0}
.zen .leftdock,.zen .rightdock,.zen .splitter {visibility:hidden}
.zen .bottom-dock {display:none}

const variants = {
    a:{name:'经典分区',en:'Classic Workbench',tag:'熟悉，且更有秩序',desc:'控件箱与对象树同时可见，画布居中，属性固定在右。把插入、选择、调整这条最常见的路径缩短。',trade:'左侧两块区域分享高度，深层对象树需要滚动。适合常规表单和初次使用。',flow:['在控件箱检索 Text，单击或拖到容器中插入。','在对象树或画布选择 saveButton，修改文字或按钮样式。','拖动两侧分隔条分配空间；检查完成后收起诊断。'],cost:'低 · 主要重排面板与命令'},

        'layout-context':()=>{selectNode(insertionParent().id);if(variant==='c'){bottomTab='layout';bottomOpen=true;renderBottom();}else notify('已选中布局容器；在右侧调整间距、内边距和主轴。');},
        'reset-property':()=>{const original=createNodes().find(n=>n.id===selected);if(!original){notify('新插入的节点没有初始属性。');return;}checkpoint('恢复初始属性');nodes[nodes.findIndex(n=>n.id===selected)]={...original,parent:nodeById(selected).parent};renderAll();notify('已恢复初始属性，可撤销。');},
        'reset-document':()=>{checkpoint('重置示例文档');nodes=createNodes();selected=variant==='c'?11:13;renderAll();notify('示例已重置，可撤销恢复。');},
        help:()=>showDialog('操作快捷键',`<table>${[['Ctrl / ⌘ S','下载交互快照'],['Ctrl / ⌘ Z','撤销'],['Ctrl / ⌘ Shift Z','重做'],['Ctrl / ⌘ D','复制节点'],['Delete','删除选中节点'],['F5','运行预览'],['/','搜索控件'],['Esc','关闭菜单、预览或专注模式'],['方向键','对象树导航；分隔条上调节宽度'],['分隔条双击','恢复默认宽度']].map(([a,b])=>`<tr><td><kbd>${a}</kbd></td><td>${b}</td></tr>`).join('')}</table><p>属性输入期间，快捷键优先交给原生输入编辑；文档命令在提交后生效。</p>`),
    };actions[action]?.();
}
function wireEvents() {
    document.addEventListener('click',e=>{
        const run=e.target.closest('[data-run-action]');if(run){if(run.dataset.runAction==='check'){const box=$('.check-box',run);box.classList.toggle('off');box.innerHTML=box.classList.contains('off')?'':icon('check');}else $('.run-result').textContent=run.dataset.node==='12'?'已模拟取消操作。':'已模拟保存，设计文档未改变。';return;}
        const action=e.target.closest('[data-action]');if(action){handleAction(action.dataset.action);return;}
        const menu=e.target.closest('[data-menu]');if(menu){showMenu(menu.dataset.menu,menu);return;}
        if(!e.target.closest('.popover'))closeMenu();
        const insert=e.target.closest('[data-insert]');if(insert){insertNode(insert.dataset.insert);return;}
        const view=e.target.closest('[data-view]');if(view){setView(view.dataset.view);return;}
        const tab=e.target.closest('[data-left-tab]');if(tab){leftTab=tab.dataset.leftTab;renderLeft();return;}
        const bottom=e.target.closest('[data-bottom]');if(bottom){bottomTab=bottom.dataset.bottom;bottomOpen=true;renderBottom();return;}
        const toggle=e.target.closest('[data-toggle-node]');if(toggle){const id=Number(toggle.dataset.toggleNode);closedNodes.has(id)?closedNodes.delete(id):closedNodes.add(id);renderTree();return;}
        const n=e.target.closest('[data-select],[data-source-node],.tree-row,.canvas-column [data-node]');if(n){selectNode(n.dataset.select||n.dataset.sourceNode||n.dataset.node);}
    });
    document.addEventListener('change',e=>{
        const field=e.target;if(field.dataset.prop){editProperty(field.dataset.prop,field.type==='checkbox'?field.checked:field.value,selected,field);return;}
        if(field.dataset.layoutProp){editProperty(field.dataset.layoutProp,field.value,Number(field.dataset.target),field);return;}
        if(field.dataset.env){if(field.dataset.env==='theme')previewTheme=field.value;else previewDensity=field.value;
            $$('[data-env="theme"]').forEach(e=>e.value=previewTheme);$$('[data-env="density"]').forEach(e=>e.value=previewDensity);
            $('.frame-environment').textContent=`${previewTheme==='dark'?'Dark':'Light'} · ${previewDensity}`;renderCanvas();notify('已更新预览环境，文档未修改。');}
    });
    document.addEventListener('input',e=>{if(e.target.id!=='tool-search')return;const q=e.target.value.trim().toLowerCase();$$('.tool-item').forEach(b=>b.hidden=!b.dataset.search.includes(q));$$('.tool-group').forEach(g=>{g.hidden=!$$('.tool-item',g).some(b=>!b.hidden);if(q)g.open=true;});$('.toolbox-empty').hidden=$$('.tool-item').some(b=>!b.hidden);});
    document.addEventListener('keydown',e=>{
        if(e.key==='Escape'){if($('#dialog').open)return;if(!$('.popover').hidden){const a=$('.popover').anchor;closeMenu();a?.focus();return;}if(document.body.classList.contains('zen'))toggleZen();return;}
        if($('#dialog').open)return;
        if(e.target.closest('.popover')&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const list=$$('button:not(:disabled)',$('.popover')),i=list.indexOf(document.activeElement);list[e.key==='Home'?0:e.key==='End'?list.length-1:(i+(e.key==='ArrowDown'?1:-1)+list.length)%list.length]?.focus();return;}
        const editing=['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName);
        if(editing){if(e.key==='Enter'&&e.target.matches('[data-prop]'))e.target.blur();return;}
        const mod=e.ctrlKey||e.metaKey;
        if(mod&&['z','y','s','d'].includes(e.key.toLowerCase())){e.preventDefault();handleAction({z:e.shiftKey?'redo':'undo',y:'redo',s:'save',d:'duplicate'}[e.key.toLowerCase()]);return;}
        if(e.key==='F5'){e.preventDefault();runPreview();return;}
        if(e.key==='Delete'){e.preventDefault();deleteNode();return;}
        if(e.key==='/'){e.preventDefault();handleAction('show-toolbox');return;}
        const tree=e.target.closest('.tree-row');if(tree&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
            e.preventDefault();const id=Number(tree.dataset.node),rows=$$('.tree-row'),i=rows.indexOf(tree);
            if(e.key==='ArrowLeft'){if(children(id).length&&!closedNodes.has(id)){closedNodes.add(id);renderTree();$(`.tree-row[data-node="${id}"]`)?.focus();}else if(nodeById(id).parent)selectNode(nodeById(id).parent,true);}
            else if(e.key==='ArrowRight'){if(closedNodes.has(id)){closedNodes.delete(id);renderTree();$(`.tree-row[data-node="${id}"]`)?.focus();}else if(children(id).length)selectNode(children(id)[0].id,true);}
            else {const next=e.key==='Home'?rows[0]:e.key==='End'?rows.at(-1):rows[Math.max(0,Math.min(rows.length-1,i+(e.key==='ArrowDown'?1:-1)))];selectNode(next.dataset.node,true);}return;
        }
    });
    $('.canvas-scroll').addEventListener('scroll',()=>requestAnimationFrame(sizeCanvas));
    let draggedType=null;
    document.addEventListener('dragstart',e=>{const b=e.target.closest('[data-insert]');if(!b)return;draggedType=b.dataset.insert;e.dataTransfer.setData('text/plain',draggedType);e.dataTransfer.effectAllowed='copy';});
    $('.canvas-scroll').addEventListener('dragover',e=>{if(!draggedType)return;e.preventDefault();$$('.drop-target').forEach(n=>n.classList.remove('drop-target'));let n=nodeById(e.target.closest('[data-node]')?.dataset.node);while(n&&!isContainer(n))n=nodeById(n.parent);const target=$(`.canvas-column [data-node="${n?.id||1}"]`);if(n?.type==='Container'&&children(n.id).length){e.dataTransfer.dropEffect='none';return;}target?.classList.add('drop-target');e.dataTransfer.dropEffect='copy';});
    $('.canvas-scroll').addEventListener('drop',e=>{if(!draggedType)return;e.preventDefault();let n=nodeById(e.target.closest('[data-node]')?.dataset.node);while(n&&!isContainer(n))n=nodeById(n.parent);insertNode(draggedType,n?.id||1);draggedType=null;});
    document.addEventListener('dragend',()=>{draggedType=null;$$('.drop-target').forEach(n=>n.classList.remove('drop-target'));});
    $$('.splitter').forEach(s=>{
        const side=s.dataset.side,min=side==='left'?180:232,max=400;
        const set=w=>{w=Math.round(Math.max(min,Math.min(max,w)));document.body.style.setProperty('--'+side,w+'px');s.setAttribute('aria-valuenow',w);};
        s.setAttribute('aria-valuenow',parseFloat(getComputedStyle(document.body).getPropertyValue('--'+side)));
        s.addEventListener('pointerdown',e=>{const start=e.clientX,initial=parseFloat(getComputedStyle(document.body).getPropertyValue('--'+side));s.setPointerCapture(e.pointerId);const move=m=>set(initial+(m.clientX-start)*(side==='left'?1:-1));const end=()=>{s.removeEventListener('pointermove',move);s.removeEventListener('pointerup',end);};s.addEventListener('pointermove',move);s.addEventListener('pointerup',end);});
        s.addEventListener('dblclick',()=>{document.body.style.removeProperty('--'+side);s.setAttribute('aria-valuenow',parseFloat(getComputedStyle(document.body).getPropertyValue('--'+side)));});
        s.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const width=parseFloat(getComputedStyle(document.body).getPropertyValue('--'+side));set(e.key==='Home'?min:e.key==='End'?max:width+(e.key==='ArrowRight'?12:-12)*(side==='left'?1:-1));}});
    });
    $('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))$('#dialog').close();});
}
if(variant&&variants[variant])renderWorkbench();else renderOverview();
    </script>
