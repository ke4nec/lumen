name: macos

on:
  push:
    branches: [master]
  pull_request:

# 同分支新提交取消旧运行，节省 macOS 分钟数（单价高于 Linux）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# v0.3 阶段8E：macOS 桌面支持（plan §2.1）。CPU-only 与 Skia 光栅为门槛。
# M7（自用路线图）：macOS GPU（Skia Ganesh + OpenGL 经 SDL/CGL）纳入
# 门槛——runner 的软件 GL（Apple GL）驱动；真实硬件 GPU 为本地/自托管
# 增强验证。窗口/resize/DPI/文本输入/剪贴板与 Linux 共用同一实现。

env:
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fetchcontent-cache
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  # M8（自用路线图）：便携包（install 规则 + CPack + 解包冒烟 + artifact）。
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (SDL3/Catch2)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: macos-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            macos-fetchcontent-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: macos-ccache-pkg-${{ github.sha }}
          restore-keys: |
            macos-ccache-pkg-
            macos-ccache-
      - name: Install ccache + ninja
        run: brew install ccache ninja || brew upgrade ccache ninja || true
      - name: Configure (portable package)
        run: >
          cmake -S . -B build-pkg -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_BUILD_PACKAGE=ON
      - name: Build
        run: cmake --build build-pkg --config Release
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Package (CPack)
        run: cpack --config CPackConfig.cmake
        working-directory: build-pkg
      - name: Unpack smoke (headless)
        working-directory: build-pkg
        run: |
          mkdir unpack && cd unpack
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z x ../*.zip > /dev/null
          else
            tar xzf ../*.tar.gz 2>/dev/null || unzip -q ../*.zip
          fi
          pkg=$(ls -d lumen-*)
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./$pkg/bin/lumen-counter.exe --headless
            ./$pkg/bin/lumen-settings.exe --headless
          else
            ./$pkg/bin/lumen-counter --headless
            ./$pkg/bin/lumen-settings --headless
          fi
      - name: Bundle .app (Contents skeleton)
        # M12：macOS 发布形态——zip 包组 Lumen.app（Contents/MacOS + lib；
        # 可执行 RPATH @loader_path/../lib 相对布局不变），Info.plist
        # 骨架 + bundle 内 headless 冒烟。CPack Bundle 生成器需重排
        # prefix 布局，留作后续增强。
        working-directory: build-pkg
        run: |
          mkdir bundle && cd bundle
          unzip -q ../*.zip
          pkg=$(ls -d lumen-*)
          app="Lumen.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources" "$app/lib"
          cp "$pkg/bin/"lumen-* "$app/MacOS/"
          cp "$pkg/lib/"*.dylib "$app/lib/" 2>/dev/null || true
          cat > "$app/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>lumen-settings</string>
            <key>CFBundleIdentifier</key><string>dev.lumen.settings</string>
            <key>CFBundleName</key><string>Lumen Settings</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.4</string>
          </dict>
          </plist>
          PLIST
          # bundle 冒烟：RPATH 相对布局一致（MacOS/../lib）。
          "$app/MacOS/lumen-settings" --headless
          cd ..
          ditto -c -k --keepParent bundle/Lumen.app Lumen.app.zip
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-package-${{ runner.os }}
          path: |
            build-pkg/lumen-*
            build-pkg/Lumen.app.zip
          retention-days: 3
          compression-level: 9
          overwrite: true
      - name: Cleanup package intermediates
        if: always()
        run: rm -rf build-pkg/unpack build-pkg/lumen-* build-pkg/bundle build-pkg/Lumen.app.zip

  cpu:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (SDL3/Catch2)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: macos-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            macos-fetchcontent-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: macos-ccache-cpu-${{ github.sha }}
          restore-keys: |
            macos-ccache-cpu-
            macos-ccache-
      - name: Install ccache + ninja
        run: brew install ccache ninja || brew upgrade ccache ninja || true
      - name: Configure (CPU-only)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_EXAMPLES=ON
      - name: Build (Debug)
        run: cmake --build build --config Debug
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Test (Debug)
        run: ctest --test-dir build --output-on-failure -C Debug --timeout 120
      - name: Headless counter smoke
        run: ./build/examples/counter/lumen-counter --headless
      # v0.3 阶段8D/8E：settings 示例与无桌面会话冒烟（dummy 驱动）。
      - name: Headless settings smoke
        run: ./build/examples/settings/lumen-settings --headless
      - name: Dummy-driver smoke (no window server dependency)
        # macOS 无 GNU coreutils 的 timeout；等价语义：dummy 驱动下运行
        # 10 秒仍存活（提前退出即失败），随后由我们终止。
        run: |
          SDL_VIDEODRIVER=dummy ./build/examples/counter/lumen-counter &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            echo "counter survived 10s under the dummy video driver"
          else
            wait "$pid"
            echo "counter exited early with status $?"
            exit 1
          fi
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-cpu-test-logs
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          retention-days: 3
          overwrite: true

  # M7：macOS GPU 门槛（Skia + Ganesh；Apple 软件 GL 渲染一帧 + 回退
  # 路径验证）。
  skia-gpu:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (SDL3/Catch2/Skia arm64)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: macos-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            macos-fetchcontent-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: macos-ccache-gpu-${{ github.sha }}
          restore-keys: |
            macos-ccache-gpu-
            macos-ccache-
      - name: Install ccache + ninja
        run: brew install ccache ninja || brew upgrade ccache ninja || true
      - name: Configure (Skia + GPU; prebuilt fetched automatically)
        run: >
          cmake -S . -B build-gpu -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_ENABLE_SKIA=ON
          -DLUMEN_ENABLE_GPU=ON
      - name: Build
        run: cmake --build build-gpu --config Release
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Test (GPU submit + CPU fallback)
        run: ctest --test-dir build-gpu --output-on-failure -C Release --timeout 180
      - name: GPU smoke (software GL)
        run: >
          ./build-gpu/examples/counter/lumen-counter
          --renderer gpu --diagnostics --frames 2
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-gpu-test-logs
          path: |
            build-gpu/Testing/Temporary/LastTest.log
            build-gpu/Testing/Temporary/LastTestsFailed.log
          retention-days: 3
          overwrite: true

  # 移动核心门槛（与 linux.yml 相同）：iOS host 使用的 SDL-free 目标集
  # 可编译且全部 headless 测试通过。
  mobile-core:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (Catch2 only, SDL-free)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: macos-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            macos-fetchcontent-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: macos-ccache-mobile-${{ github.sha }}
          restore-keys: |
            macos-ccache-mobile-
            macos-ccache-
      - name: Install ccache + ninja
        run: brew install ccache ninja || brew upgrade ccache ninja || true
      - name: Configure (SDL-free mobile core)
        run: >
          cmake -S . -B build-mobile -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_MOBILE_CORE=ON
      - name: Build (Debug)
        run: cmake --build build-mobile --config Debug
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Test (headless)
        run: ctest --test-dir build-mobile --output-on-failure -C Debug --timeout 120
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-mobile-test-logs
          path: |
            build-mobile/Testing/Temporary/LastTest.log
            build-mobile/Testing/Temporary/LastTestsFailed.log
          retention-days: 3
          overwrite: true

  # M12：Skia 光栅便携包（Release；解包冒烟同 CPU 变体，zip 布局即可
  # 启动——.app 组装暂限 CPU 主发布件）。
  package-skia:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (SDL3/Catch2/Skia)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: macos-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            macos-fetchcontent-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: macos-ccache-pkg-skia-${{ github.sha }}
          restore-keys: |
            macos-ccache-pkg-skia-
            macos-ccache-pkg-
            macos-ccache-
      - name: Install ccache + ninja
        run: brew install ccache ninja || brew upgrade ccache ninja || true
      - name: Configure (portable package + Skia)
        run: >
          cmake -S . -B build-pkg -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_BUILD_PACKAGE=ON
          -DLUMEN_ENABLE_SKIA=ON
      - name: Build
        run: cmake --build build-pkg --config Release
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Package (CPack)
        run: cpack --config CPackConfig.cmake
        working-directory: build-pkg
      - name: Unpack smoke (headless)
        working-directory: build-pkg
        run: |
          mkdir unpack && cd unpack
          tar xzf ../*.tar.gz 2>/dev/null || unzip -q ../*.zip
          pkg=$(ls -d lumen-*)
          ./$pkg/bin/lumen-counter --headless
          ./$pkg/bin/lumen-settings --headless
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-package-skia-${{ runner.os }}
          path: build-pkg/lumen-*
          retention-days: 3
          compression-level: 9
          overwrite: true
      - name: Cleanup package intermediates
        if: always()
        run: rm -rf build-pkg/unpack build-pkg/lumen-*
