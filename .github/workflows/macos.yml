name: macos

on:
  push:
    branches: [master]
  pull_request:

# v0.3 阶段8E：macOS 桌面支持（plan §2.1）。CPU-only 与 Skia 光栅为门槛。
# M7（自用路线图）：macOS GPU（Skia Ganesh + OpenGL 经 SDL/CGL）纳入
# 门槛——runner 的软件 GL（Apple GL）驱动；真实硬件 GPU 为本地/自托管
# 增强验证。窗口/resize/DPI/文本输入/剪贴板与 Linux 共用同一实现。

jobs:
  cpu:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure (CPU-only)
        run: >
          cmake -S . -B build
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_EXAMPLES=ON
      - name: Build (Debug)
        run: cmake --build build --config Debug
      - name: Test (Debug)
        run: ctest --test-dir build --output-on-failure -C Debug --timeout 120
      - name: Headless counter smoke
        run: ./build/examples/counter/lumen-counter --headless
      # v0.3 阶段8D/8E：settings 示例与无桌面会话冒烟（dummy 驱动）。
      - name: Headless settings smoke
        run: ./build/examples/settings/lumen-settings --headless
      - name: Dummy-driver smoke (no window server dependency)
        # macOS 无 GNU coreutils 的 timeout；等价语义：dummy 驱动下运行
        # 10 秒仍存活（提前退出即失败），随后由我们终止。
        run: |
          SDL_VIDEODRIVER=dummy ./build/examples/counter/lumen-counter &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            echo "counter survived 10s under the dummy video driver"
          else
            wait "$pid"
            echo "counter exited early with status $?"
            exit 1
          fi

  # M7：macOS GPU 门槛（Skia + Ganesh；Apple 软件 GL 渲染一帧 + 回退
  # 路径验证）。
  skia-gpu:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Skia + GPU; prebuilt fetched automatically)
        run: >
          cmake -S . -B build-gpu -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_ENABLE_SKIA=ON
          -DLUMEN_ENABLE_GPU=ON
      - name: Build
        run: cmake --build build-gpu --config Release
      - name: Test (GPU submit + CPU fallback)
        run: ctest --test-dir build-gpu --output-on-failure -C Release --timeout 180
      - name: GPU smoke (software GL)
        run: >
          ./build-gpu/examples/counter/lumen-counter
          --renderer gpu --diagnostics --frames 2

  # 移动核心门槛（与 linux.yml 相同）：iOS host 使用的 SDL-free 目标集
  # 可编译且全部 headless 测试通过。
  mobile-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure (SDL-free mobile core)
        run: >
          cmake -S . -B build-mobile
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_MOBILE_CORE=ON
      - name: Build (Debug)
        run: cmake --build build-mobile --config Debug
      - name: Test (headless)
        run: ctest --test-dir build-mobile --output-on-failure -C Debug --timeout 120
