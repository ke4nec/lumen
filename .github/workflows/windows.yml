name: windows

on:
  push:
    branches: [master]
  pull_request:

# 同分支新提交取消旧运行，节省 Windows 分钟数。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# v0.2 阶段7E：Windows CI 矩阵 —— CPU-only 与 Skia 光栅为强制门槛；
# Skia GPU 在 runner 上通常无硬件 GL，gpu smoke 验证探测失败时的
# CPU 自动回退（回退行为是强制门槛，硬件加速是增强项）。

env:
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fetchcontent-cache

jobs:
  # M8（自用路线图）：便携包（install 规则 + CPack + 解包冒烟 + artifact）。
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (SDL3/Catch2/zlib)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: windows-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            windows-fetchcontent-
      - name: Configure (portable package)
        # 与本文件其他 job 一致用默认 VS 生成器（多配置；Ninja 在
        # PowerShell 默认环境缺 VS 变量易配失败）。
        run: >
          cmake -S . -B build-pkg
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_BUILD_PACKAGE=ON
      - name: Build
        run: cmake --build build-pkg --config Release
      - name: Package (CPack)
        run: cpack --config CPackConfig.cmake
        working-directory: build-pkg
      - name: Unpack smoke (headless)
        shell: bash
        working-directory: build-pkg
        run: |
          mkdir unpack && cd unpack
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z x ../*.zip > /dev/null
          else
            tar xzf ../*.tar.gz 2>/dev/null || unzip -q ../*.zip
          fi
          pkg=$(ls -d lumen-*)
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./$pkg/bin/lumen-counter.exe --headless
            ./$pkg/bin/lumen-settings.exe --headless
          else
            ./$pkg/bin/lumen-counter --headless
            ./$pkg/bin/lumen-settings --headless
          fi
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-package-${{ runner.os }}
          path: build-pkg/lumen-*
          retention-days: 3
          compression-level: 9
          overwrite: true
      - name: Cleanup package intermediates
        if: always()
        shell: bash
        run: rm -rf build-pkg/unpack build-pkg/lumen-*

  cpu:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (SDL3/Catch2/zlib)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: windows-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            windows-fetchcontent-
      # Windows MSVC + ccache 尚不成熟（hendrikmuhs/ccache-action 在
      # windows-2025 + Node24 下 restore 失败），暂只缓存 FetchContent
      #（SDL3/Catch2/Skia 预编译包为主要下载耗时）；编译缓存待 sccache
      # 方案验证后接入。
      - name: Configure (CPU-only)
        run: >
          cmake -S . -B build
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_EXAMPLES=ON
      - name: Build (Debug)
        run: cmake --build build --config Debug
      - name: Test (Debug)
        run: ctest --test-dir build --output-on-failure -C Debug --timeout 120
      - name: Headless counter smoke
        run: ./build/examples/counter/Debug/lumen-counter.exe --headless
      # v0.3 阶段8D：settings 示例（滚动/表单/弹窗/导航）headless 冒烟。
      - name: Headless settings smoke
        run: ./build/examples/settings/Debug/lumen-settings.exe --headless
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cpu-test-logs
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          retention-days: 3
          overwrite: true

  skia-raster:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (SDL3/Catch2/Skia/zlib)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: windows-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            windows-fetchcontent-
      - name: Configure (Skia)
        run: >
          cmake -S . -B build-skia
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_ENABLE_SKIA=ON
      # 预编译 skia.lib 为 Release/MT 静态 CRT：Windows 上 Skia 构建只支持
      # Release 配置（见根 CMakeLists 注释）。
      - name: Build (Release)
        run: cmake --build build-skia --config Release
      - name: Test (Release, incl. CPU/Skia consistency)
        run: ctest --test-dir build-skia --output-on-failure -C Release --timeout 120
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-skia-test-logs
          path: |
            build-skia/Testing/Temporary/LastTest.log
            build-skia/Testing/Temporary/LastTestsFailed.log
          retention-days: 3
          overwrite: true

  # counter_gpu_fallback 用 dummy 驱动强制探测失败，验证示例回退 CPU、
  # 成功呈现一帧并退出；GPU 可用时，其他 smoke 额外验证真实提交。
  skia-gpu:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (SDL3/Catch2/Skia/zlib)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: windows-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            windows-fetchcontent-
      - name: Configure (Skia + GPU)
        run: >
          cmake -S . -B build-gpu
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_ENABLE_SKIA=ON
          -DLUMEN_ENABLE_GPU=ON
      - name: Build (Release)
        run: cmake --build build-gpu --config Release
      - name: Test (includes forced CPU fallback and presentation)
        run: ctest --test-dir build-gpu --output-on-failure -C Release --timeout 180
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gpu-test-logs
          path: |
            build-gpu/Testing/Temporary/LastTest.log
            build-gpu/Testing/Temporary/LastTestsFailed.log
          retention-days: 3
          overwrite: true

  # M12：Skia 光栅便携包（Release-only——预编译 skia.lib 为静态 CRT，
  # Windows 上 Skia 只支持 Release 配置；解包冒烟同 CPU 变体）。
  package-skia:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (SDL3/Catch2/Skia/zlib)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: windows-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            windows-fetchcontent-
      - name: Configure (portable package + Skia)
        run: >
          cmake -S . -B build-pkg
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_BUILD_PACKAGE=ON
          -DLUMEN_ENABLE_SKIA=ON
      - name: Build (Release)
        run: cmake --build build-pkg --config Release
      - name: Package (CPack)
        run: cpack --config CPackConfig.cmake -C Release
        working-directory: build-pkg
      - name: Unpack smoke (headless)
        shell: bash
        working-directory: build-pkg
        run: |
          mkdir unpack && cd unpack
          7z x ../*.zip > /dev/null
          pkg=$(ls -d lumen-*)
          ./$pkg/bin/lumen-counter.exe --headless
          ./$pkg/bin/lumen-settings.exe --headless
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-package-skia-${{ runner.os }}
          path: build-pkg/lumen-*
          retention-days: 3
          compression-level: 9
          overwrite: true
      - name: Cleanup package intermediates
        if: always()
        shell: bash
        run: rm -rf build-pkg/unpack build-pkg/lumen-*
