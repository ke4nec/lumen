name: linux

on:
  push:
    branches: [master]
  pull_request:

# Single source of truth for Linux system dependencies (SDL3 window/input,
# Skia FontConfig, Xvfb smoke); shared by the cpu and skia jobs below.
env:
  LUMEN_LINUX_DEPS: >-
    cmake ninja-build pkg-config
    libx11-dev libxext-dev libxrandr-dev libxcursor-dev
    libxfixes-dev libxi-dev libxss-dev libwayland-dev
    libxkbcommon-dev libdrm-dev libgbm-dev
    libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev
    libdbus-1-dev libibus-1.0-dev libdecor-0-dev
    libasound2-dev libpulse-dev libaudio-dev libjack-dev
    libsndio-dev libsamplerate0-dev liburing-dev
    wayland-protocols libfontconfig1-dev libfreetype6-dev
    xvfb

jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LUMEN_LINUX_DEPS
      - name: Configure (CPU-only + benchmarks)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Debug
      - name: Headless counter smoke
        run: ./build/examples/counter/lumen-counter --headless
      # v0.3 阶段8D：settings 示例（滚动/表单/弹窗/导航）headless 冒烟。
      - name: Headless settings smoke
        run: ./build/examples/settings/lumen-settings --headless
      - name: Windowed smoke (Xvfb)
        run: xvfb-run -a timeout 5 ./build/examples/counter/lumen-counter || test $? -eq 124
      - name: Windowed settings smoke (Xvfb)
        run: xvfb-run -a timeout 5 ./build/examples/settings/lumen-settings || test $? -eq 124
      # M0 基线冻结：固定场景基准 repeatability 门槛；报告（bench-*.json）
      # 自带 backend/scenario/toolchain/build_type/commit(GITHUB_SHA)/
      # platform(RUNNER_OS)/frame_hash（见 benchmarks/scene_bench.cpp），
      # 与归档基线 docs/perf-baselines/v0.2-cpu-scene.json 同场景定义；
      # canonical 归档命令见 docs/build-commands.md（--frames 300 --warmup 30）。
      - name: Benchmark (repeatability gate + report)
        run: |
          ./build/benchmarks/lumen-scene-bench --frames 120 --warmup 10 --json > bench-1.json
          ./build/benchmarks/lumen-scene-bench --frames 120 --warmup 10 --json > bench-2.json
          h1=$(grep -o '"frame_hash": "[0-9a-f]*"' bench-1.json)
          h2=$(grep -o '"frame_hash": "[0-9a-f]*"' bench-2.json)
          echo "run1: $h1"; echo "run2: $h2"
          test "$h1" = "$h2"
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-benchmark-report
          path: bench-*.json

  skia:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LUMEN_LINUX_DEPS
      - name: Configure (Skia)
        run: >
          cmake -S . -B build-skia -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_ENABLE_SKIA=ON
      - name: Build
        run: cmake --build build-skia --config Release
      - name: Test (incl. CPU/Skia consistency)
        run: ctest --test-dir build-skia --output-on-failure -C Release
      - name: Windowed Skia smoke (Xvfb)
        run: xvfb-run -a timeout 5 ./build-skia/examples/counter/lumen-counter --renderer skia || test $? -eq 124

  # v0.2 阶段7C/7E：Skia Ganesh GPU 后端。CI 无硬件 GPU，经 Mesa
  # llvmpipe 软件适配器运行 —— 软件适配器是强制门槛，硬件 GPU 只是
  # 本地/自托管环境的增强 smoke。
  skia-gpu:
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (incl. Mesa DRI/llvmpipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y $LUMEN_LINUX_DEPS libgl1-mesa-dri mesa-utils
      - name: Configure (Skia + GPU)
        run: >
          cmake -S . -B build-gpu -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_ENABLE_SKIA=ON
          -DLUMEN_ENABLE_GPU=ON
      - name: Build
        run: cmake --build build-gpu --config Release
      - name: Test (GPU submit + fallback on software GL)
        run: xvfb-run -a ctest --test-dir build-gpu --output-on-failure -C Release --timeout 120
      - name: Windowed GPU smoke (Xvfb + llvmpipe)
        run: >
          xvfb-run -a cmake
          -DCOUNTER=${{ github.workspace }}/build-gpu/examples/counter/lumen-counter
          -DEXPECTED_BACKEND=skia-gpu
          -P tests/counter_gpu_smoke.cmake

  # v0.3 阶段8E：移动核心门槛 —— SDL-free 配置（Android/iOS host 使用的
  # 目标集）必须可编译并通过全部 headless 测试，不依赖桌面会话。
  mobile-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Configure (SDL-free mobile core)
        run: >
          cmake -S . -B build-mobile -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_MOBILE_CORE=ON
      - name: Build
        run: cmake --build build-mobile --config Debug
      - name: Test (headless, no desktop session)
        run: ctest --test-dir build-mobile --output-on-failure -C Debug
