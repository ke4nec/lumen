name: linux

on:
  push:
    branches: [master]
  pull_request:

# 同分支新提交取消进行中的旧运行，节省分钟数与排队。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for Linux system dependencies (SDL3 window/input,
# Skia FontConfig, Xvfb smoke); shared by the cpu and skia jobs below.
env:
  LUMEN_PERF_BASELINE_COMMIT: 445bae5dd4893e7020054ed3c7b98dfdf8d77191
  LUMEN_LINUX_DEPS: >-
    cmake ninja-build pkg-config ccache
    libx11-dev libxext-dev libxrandr-dev libxcursor-dev
    libxfixes-dev libxi-dev libxss-dev libwayland-dev
    libxkbcommon-dev libdrm-dev libgbm-dev
    libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev
    libdbus-1-dev libibus-1.0-dev libdecor-0-dev
    libasound2-dev libpulse-dev libaudio-dev libjack-dev
    libsndio-dev libsamplerate0-dev liburing-dev
    wayland-protocols libfontconfig1-dev libfreetype6-dev
    xvfb at-spi2-core gir1.2-atspi-2.0 python3-gi dbus-x11
  # FetchContent（SDL3/Catch2/Skia/zlib）集中到工作区外缓存目录，
  # 跨 job 经 actions/cache 复用，避免每次重新 clone/下载。
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fetchcontent-cache
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  # M8（自用路线图）：便携包（install 规则 + CPack + 解包冒烟 + artifact）。
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (SDL3/Catch2)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: linux-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            linux-fetchcontent-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-pkg-${{ github.sha }}
          restore-keys: |
            linux-ccache-pkg-
            linux-ccache-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LUMEN_LINUX_DEPS
      - name: Configure (portable package)
        run: >
          cmake -S . -B build-pkg -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_BUILD_PACKAGE=ON
      - name: Build
        run: cmake --build build-pkg --config Release
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Package (CPack)
        run: cpack --config CPackConfig.cmake
        working-directory: build-pkg
      - name: Unpack smoke (headless)
        working-directory: build-pkg
        run: |
          mkdir unpack && cd unpack
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z x ../*.zip > /dev/null
          else
            tar xzf ../*.tar.gz 2>/dev/null || unzip -q ../*.zip
          fi
          pkg=$(ls -d lumen-*)
          test -f "$pkg/lib/liblumen-render.a"
          test -f "$pkg/lib/cmake/Lumen/LumenConfig.cmake"
          test -f "$pkg/lib/cmake/Lumen/LumenTargets.cmake"
          test -f "$pkg/include/lumen/render/renderer.h"
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./$pkg/bin/lumen-counter.exe --headless
            ./$pkg/bin/lumen-settings.exe --headless
          else
            ./$pkg/bin/lumen-counter --headless
            ./$pkg/bin/lumen-settings --headless
          fi
      - name: Relocated SDK consumer
        run: python3 -B tests/package_consumer_smoke.py --unpack-root build-pkg/unpack
      - name: Build AppImage (linuxdeploy)
        # M12：Linux 发布形态——TGZ 解包为 AppDir（usr/ 前缀布局），
        # linuxdeploy 组装（desktop/icon 来自 install 规则；RPATH
        # $ORIGIN/../lib 在 usr/bin↔usr/lib 相对布局下不变）。
        working-directory: build-pkg
        run: |
          mkdir -p appimage/AppDir/usr/bin appimage/AppDir/usr/lib appimage/AppDir/usr/share
          # Runtime only: headers, static archives and CMake exports stay in the SDK.
          cp unpack/lumen-*/bin/* appimage/AppDir/usr/bin/
          cp -a unpack/lumen-*/lib/lib*.so* appimage/AppDir/usr/lib/
          cp -a unpack/lumen-*/share/applications unpack/lumen-*/share/icons appimage/AppDir/usr/share/
          cd appimage
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          OUTPUT=lumen-settings-x86_64.AppImage ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/lumen-settings.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/128x128/apps/lumen.png \
            --output appimage
          test -f lumen-settings-x86_64.AppImage
          # Gallery 应用图标（docs/lumen-gallery-icon-design.md §3）：install
          # 布局内多尺寸 hicolor 供 linuxdeploy 选档；入口校验桌面文件与
          # 图标均在包内（AppImage 图标损坏教训 8f40e98：打包内断言）。
          test -f AppDir/usr/share/applications/lumen-gallery.desktop
          test -f AppDir/usr/share/icons/hicolor/256x256/apps/lumen-gallery.png
          OUTPUT=lumen-gallery-x86_64.AppImage ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/lumen-gallery.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/lumen-gallery.png \
            --output appimage
          test -f lumen-gallery-x86_64.AppImage
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-package-${{ runner.os }}
          path: |
            build-pkg/lumen-*.tar.gz
            build-pkg/appimage/*.AppImage
          # 便携包为发布件，短保留即时释放配额；正式发布请走 Release 附件。
          retention-days: 3
          compression-level: 9
          overwrite: true
      - name: Cleanup package intermediates
        if: always()
        run: rm -rf build-pkg/unpack build-pkg/lumen-* build-pkg/appimage

  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (SDL3/Catch2/Skia)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: linux-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            linux-fetchcontent-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-cpu-${{ github.sha }}
          restore-keys: |
            linux-ccache-cpu-
            linux-ccache-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LUMEN_LINUX_DEPS
      - name: Configure (CPU-only + benchmarks)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_BUILD_BENCHMARKS=ON
          -DLUMEN_ENABLE_ACCESSIBILITY_BRIDGE=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Native AT-SPI registry and client round-trip
        run: dbus-run-session -- /usr/bin/python3 -B tests/atspi_live_tests.py build/tests/lumen-atspi-live-app
      - name: Native accessibility preference changes
        run: dbus-run-session -- /usr/bin/python3 -B tests/native_preferences_live_tests.py build/tests/lumen-native-preferences-live-app
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
      - name: Headless counter smoke
        run: ./build/examples/counter/lumen-counter --headless
      # v0.3 阶段8D：settings 示例（滚动/表单/弹窗/导航）headless 冒烟。
      - name: Headless settings smoke
        run: ./build/examples/settings/lumen-settings --headless
      - name: Windowed smoke (Xvfb)
        run: xvfb-run -a timeout 5 ./build/examples/counter/lumen-counter || test $? -eq 124
      - name: Windowed settings smoke (Xvfb)
        run: xvfb-run -a timeout 5 ./build/examples/settings/lumen-settings || test $? -eq 124
      # M7 性能门槛：固定场景逐项比较 p50/p95、分配量、命令数和
      # submit/GPU wait；同场景三次运行仍须保持 frame_hash 一致。
      - name: Checkout pinned performance reference
        uses: actions/checkout@v5
        with:
          ref: ${{ env.LUMEN_PERF_BASELINE_COMMIT }}
          path: .perf-reference
      - name: Build reference with the same toolchain
        run: |
          cmake -S .perf-reference -B perf-reference-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUMEN_BUILD_TESTS=OFF -DLUMEN_BUILD_EXAMPLES=OFF -DLUMEN_BUILD_BENCHMARKS=ON
          cmake --build perf-reference-build --parallel --target lumen-scene-bench
      - name: Benchmark (CPU regression gate)
        run: >-
          python3 -B benchmarks/run_perf_gate.py --backend cpu
          --baseline-source .perf-reference --baseline-bin perf-reference-build/benchmarks/lumen-scene-bench
          --current-bin build/benchmarks/lumen-scene-bench --output bench-results/cpu
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-benchmark-report
          path: bench-results/cpu/
          # 归档同机实测基线、候选与逐项门槛；固定基准提交见 reference.json。
          retention-days: 3
          compression-level: 9
          overwrite: true
      - name: Cleanup benchmark intermediates
        if: always()
        run: rm -f bench-cpu-*.json
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-cpu-test-logs
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          retention-days: 3
          overwrite: true

  skia:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (SDL3/Catch2/Skia)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: linux-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            linux-fetchcontent-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-skia-${{ github.sha }}
          restore-keys: |
            linux-ccache-skia-
            linux-ccache-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LUMEN_LINUX_DEPS
      - name: Configure (Skia)
        run: >
          cmake -S . -B build-skia -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_BUILD_BENCHMARKS=ON
          -DLUMEN_ENABLE_SKIA=ON
      - name: Build
        run: cmake --build build-skia --config Release
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Test (incl. CPU/Skia consistency)
        run: ctest --test-dir build-skia --output-on-failure -C Release
      - name: Windowed Skia smoke (Xvfb)
        run: xvfb-run -a timeout 5 ./build-skia/examples/counter/lumen-counter --renderer skia || test $? -eq 124
      - name: Checkout pinned performance reference
        uses: actions/checkout@v5
        with:
          ref: ${{ env.LUMEN_PERF_BASELINE_COMMIT }}
          path: .perf-reference
      - name: Build reference with the same toolchain
        run: |
          cmake -S .perf-reference -B perf-reference-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUMEN_BUILD_TESTS=OFF -DLUMEN_BUILD_EXAMPLES=OFF -DLUMEN_BUILD_BENCHMARKS=ON -DLUMEN_ENABLE_SKIA=ON
          cmake --build perf-reference-build --parallel --target lumen-scene-bench
      - name: Benchmark (Skia regression gate)
        run: >-
          python3 -B benchmarks/run_perf_gate.py --backend skia
          --baseline-source .perf-reference --baseline-bin perf-reference-build/benchmarks/lumen-scene-bench
          --current-bin build-skia/benchmarks/lumen-scene-bench --output bench-results/skia
      - name: Upload Skia benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skia-benchmark-report
          path: bench-results/skia/
          retention-days: 3
          compression-level: 9
          overwrite: true
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-skia-test-logs
          path: |
            build-skia/Testing/Temporary/LastTest.log
            build-skia/Testing/Temporary/LastTestsFailed.log
          retention-days: 3
          overwrite: true

  # v0.2 阶段7C/7E：Skia Ganesh GPU 后端。CI 无硬件 GPU，经 Mesa
  # llvmpipe 软件适配器运行 —— 软件适配器是强制门槛，硬件 GPU 只是
  # 本地/自托管环境的增强 smoke。
  skia-gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (SDL3/Catch2/Skia)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: linux-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            linux-fetchcontent-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-gpu-${{ github.sha }}
          restore-keys: |
            linux-ccache-gpu-
            linux-ccache-
      - name: Install system dependencies (incl. Mesa DRI/llvmpipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y $LUMEN_LINUX_DEPS libgl1-mesa-dri mesa-utils
      - name: Configure (Skia + GPU)
        run: >
          cmake -S . -B build-gpu -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_BUILD_BENCHMARKS=ON
          -DLUMEN_ENABLE_SKIA=ON
          -DLUMEN_ENABLE_GPU=ON
      - name: Build
        run: cmake --build build-gpu --config Release
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Test (GPU submit + fallback on software GL)
        run: xvfb-run -a ctest --test-dir build-gpu --output-on-failure -C Release --timeout 120
      - name: Windowed GPU smoke (Xvfb + llvmpipe)
        run: >
          xvfb-run -a cmake
          -DCOUNTER=${{ github.workspace }}/build-gpu/examples/counter/lumen-counter
          -DEXPECTED_BACKEND=skia-gpu
          -P tests/counter_gpu_smoke.cmake
      - name: Checkout pinned performance reference
        uses: actions/checkout@v5
        with:
          ref: ${{ env.LUMEN_PERF_BASELINE_COMMIT }}
          path: .perf-reference
      - name: Build reference with the same toolchain
        run: |
          cmake -S .perf-reference -B perf-reference-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUMEN_BUILD_TESTS=OFF -DLUMEN_BUILD_EXAMPLES=OFF -DLUMEN_BUILD_BENCHMARKS=ON -DLUMEN_ENABLE_SKIA=ON -DLUMEN_ENABLE_GPU=ON
          cmake --build perf-reference-build --parallel --target lumen-scene-bench
      - name: Benchmark (GPU regression gate, llvmpipe)
        run: >-
          xvfb-run -a python3 -B benchmarks/run_perf_gate.py --backend gpu
          --baseline-source .perf-reference --baseline-bin perf-reference-build/benchmarks/lumen-scene-bench
          --current-bin build-gpu/benchmarks/lumen-scene-bench --output bench-results/gpu
      - name: Upload GPU benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-benchmark-report
          path: bench-results/gpu/
          retention-days: 3
          compression-level: 9
          overwrite: true
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gpu-test-logs
          path: |
            build-gpu/Testing/Temporary/LastTest.log
            build-gpu/Testing/Temporary/LastTestsFailed.log
          retention-days: 3
          overwrite: true

  # v0.3 阶段8E：移动核心门槛 —— SDL-free 配置（Android/iOS host 使用的
  # 目标集）必须可编译并通过全部 headless 测试，不依赖桌面会话。
  mobile-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (Catch2 only, SDL-free)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: linux-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            linux-fetchcontent-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-mobile-${{ github.sha }}
          restore-keys: |
            linux-ccache-mobile-
            linux-ccache-
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache
      - name: Configure (SDL-free mobile core)
        run: >
          cmake -S . -B build-mobile -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DLUMEN_BUILD_TESTS=ON
          -DLUMEN_BUILD_MOBILE_CORE=ON
      - name: Build
        run: cmake --build build-mobile --config Debug
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Test (headless, no desktop session)
        run: ctest --test-dir build-mobile --output-on-failure -C Debug
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-mobile-test-logs
          path: |
            build-mobile/Testing/Temporary/LastTest.log
            build-mobile/Testing/Temporary/LastTestsFailed.log
          retention-days: 3
          overwrite: true

  # M12：Skia 光栅便携包（Release；解包冒烟同 CPU 变体）。
  package-skia:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (SDL3/Catch2/Skia)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: linux-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            linux-fetchcontent-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-pkg-skia-${{ github.sha }}
          restore-keys: |
            linux-ccache-pkg-skia-
            linux-ccache-pkg-
            linux-ccache-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LUMEN_LINUX_DEPS
      - name: Configure (portable package + Skia)
        run: >
          cmake -S . -B build-pkg -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_BUILD_PACKAGE=ON
          -DLUMEN_ENABLE_SKIA=ON
      - name: Build
        run: cmake --build build-pkg --config Release
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Package (CPack)
        run: cpack --config CPackConfig.cmake
        working-directory: build-pkg
      - name: Unpack smoke (headless)
        working-directory: build-pkg
        run: |
          mkdir unpack && cd unpack
          tar xzf ../*.tar.gz 2>/dev/null || unzip -q ../*.zip
          pkg=$(ls -d lumen-*)
          test -f "$pkg/lib/liblumen-render.a"
          test -f "$pkg/lib/cmake/Lumen/LumenConfig.cmake"
          test -f "$pkg/lib/cmake/Lumen/LumenTargets.cmake"
          ./$pkg/bin/lumen-counter --headless
          ./$pkg/bin/lumen-settings --headless
      - name: Relocated SDK consumer
        run: python3 -B tests/package_consumer_smoke.py --unpack-root build-pkg/unpack
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-package-skia-${{ runner.os }}
          path: build-pkg/lumen-*
          retention-days: 3
          compression-level: 9
          overwrite: true
      - name: Cleanup package intermediates
        if: always()
        run: rm -rf build-pkg/unpack build-pkg/lumen-*

  # M12：Skia+GPU 便携包（Linux llvmpipe 软件适配器真验 GPU 路径；
  # Windows/macOS GPU 包留待后续——runner 无 GPU）。
  package-skia-gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Cache FetchContent deps (SDL3/Catch2/Skia)
        uses: actions/cache@v4
        with:
          path: .fetchcontent-cache
          key: linux-fetchcontent-${{ hashFiles('cmake/dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            linux-fetchcontent-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-pkg-gpu-${{ github.sha }}
          restore-keys: |
            linux-ccache-pkg-gpu-
            linux-ccache-pkg-
            linux-ccache-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LUMEN_LINUX_DEPS
      - name: Configure (portable package + Skia + GPU)
        run: >
          cmake -S . -B build-pkg -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLUMEN_BUILD_EXAMPLES=ON
          -DLUMEN_BUILD_PACKAGE=ON
          -DLUMEN_ENABLE_SKIA=ON
          -DLUMEN_ENABLE_GPU=ON
      - name: Build
        run: cmake --build build-pkg --config Release
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Package (CPack)
        run: cpack --config CPackConfig.cmake
        working-directory: build-pkg
      - name: Unpack smoke (headless + llvmpipe GPU)
        working-directory: build-pkg
        run: |
          mkdir unpack && cd unpack
          tar xzf ../*.tar.gz 2>/dev/null || unzip -q ../*.zip
          pkg=$(ls -d lumen-*)
          test -f "$pkg/lib/liblumen-render.a"
          test -f "$pkg/lib/cmake/Lumen/LumenConfig.cmake"
          test -f "$pkg/lib/cmake/Lumen/LumenTargets.cmake"
          ./$pkg/bin/lumen-counter --headless
          ./$pkg/bin/lumen-settings --headless
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
            ./$pkg/bin/lumen-counter --renderer gpu --diagnostics --frames 2
      - name: Relocated SDK consumer
        run: python3 -B tests/package_consumer_smoke.py --unpack-root build-pkg/unpack
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-package-skia-gpu-${{ runner.os }}
          path: build-pkg/lumen-*
          retention-days: 3
          compression-level: 9
          overwrite: true
      - name: Cleanup package intermediates
        if: always()
        run: rm -rf build-pkg/unpack build-pkg/lumen-*
